name: Build Sileo catalog

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync.yml'
      - 'scripts/sync_appvault.py'
      - 'sileo/sources.json'
      - 'sileo/README.md'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: shared-sileo-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync verified AppVault rootless release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_appvault.py
      - name: Build and verify catalog
        run: |
          python3 scripts/check_version_ui.py
          python3 scripts/build_tweaks_repo.py --sync
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Publish generated files
        run: |
          git config user.name 'soum91 catalog bot'
          git config user.email 'soum91@users.noreply.github.com'
          git add sileo
          git diff --cached --quiet || git commit -m 'Sync Sileo catalog [skip ci]'
          # A noncatalog documentation commit may land after this job checked
          # out main. Rebase our verified generated catalog, never force-push.
          git pull --rebase origin main
          git push origin HEAD:main
